<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create your plan</title>
    <link rel="stylesheet" href="./create.css">
</head>
<body>
    <section class="create-plan">
        <h1>Create Your Plan</h1>
        <p>Build a subscription plan that fits your needs.</p>
        <form action="#" method="post">
            <label for="coffee-type">Select Coffee Type:</label>
            <select id="coffee-type" name="coffee-type">
                <option value="espresso">Espresso</option>
                <option value="americano">Americano</option>
                <option value="latte">Latte</option>
                <option value="cappuccino">Cappuccino</option>
            </select>

            <label for="quantity">Select Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="10">

            <label for="delivery-frequency">Select Delivery Frequency:</label>
            <select id="delivery-frequency" name="delivery-frequency">
                <option value="weekly">Weekly</option>
                <option value="bi-weekly">Bi-Weekly</option>
                <option value="monthly">Monthly</option>
            </select>

            <button type="submit">Create Plan</button>
        </form>
        <div class="mai"> </div>
        <div class="starp"><nav class="navbar bg-body-tertiary">
  <div class="container">
    <a class="navbar-brand" href="#">
      <img src="/docs/5.3/assets/brand/bootstrap-logo.svg" alt="Bootstrap" width="30" height="24">
    </a>
  </div>
</nav>
</div>
</body>
</html>
